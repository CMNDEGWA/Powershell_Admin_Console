
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "Powershell-Admin-Console"
version = "0.1.0"
description = "A local-first PowerShell administration console"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "psutil>=6.0,<8.0",
    "reportlab>=4.2,<5.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
